version: '3.8'

services:

  client:
    container_name: client
    build:
      context: ..
      dockerfile: ./Docker/Dockerfile
      target: client-production
    restart: unless-stopped
    env_file:
      - ../.env
    expose:
      - "3000"
    networks:
      - queue-net
    profiles:
      - production
    deploy:  # Resource limits
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  nginx:
    build:
      context: ..
      dockerfile: ./Docker/Dockerfile.nginx
      args:
        - ENVIRONMENT=prod
    container_name: nginx
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt/live/poltic.in/fullchain.pem:/etc/letsencrypt/live/poltic.in/fullchain.pem:ro
      - /etc/letsencrypt/live/poltic.in/privkey.pem:/etc/letsencrypt/live/poltic.in/privkey.pem:ro
    restart: always
    networks:
      - queue-net
    depends_on:
      - client
    profiles:
      - production

networks:
  queue-net:
    driver: bridge